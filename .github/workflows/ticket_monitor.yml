name: Avengers 12 AM Ticket Monitor

on:
  schedule:
    # Runs hourly at minute 37 in GitHub Cloud (single-shot execution)
    - cron: '37 * * * *'
  workflow_dispatch:
    # Allows you to click "Run workflow" button manually anytime

concurrency:
  group: ticket-monitor-cloud
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Ticket Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_cloud.py

      - name: Commit and Push State
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud_seen_shows.json
          if ! git diff --staged --quiet; then
            echo "[*] Changes detected in cloud_seen_shows.json. Committing state..."
            git commit -m "chore: update cloud show deduplication state [skip ci]"
            git push
          else
            echo "[*] No changes in cloud_seen_shows.json. Nothing to commit."
          fi
