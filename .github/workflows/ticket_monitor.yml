name: Avengers 12 AM Ticket Monitor

on:
  schedule:
    # Runs every 5 minutes automatically 24/7 in GitHub Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows you to click "Run workflow" button manually anytime

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Ticket Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_cloud.py
